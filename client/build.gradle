plugins {
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.12'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'beat.osu'
version '1.0-SNAPSHOT'

ext {
  junitVersion = '5.10.2'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'beat.osu.client'
  mainClass = 'beat.osu.client.Main'
}

javafx {
  version = '17.0.6'
  modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.media']
}

dependencies {
  implementation project(':shared')

  implementation('org.controlsfx:controlsfx:11.2.1')
  implementation('com.dlsc.formsfx:formsfx-core:11.6.0') {
    exclude(group: 'org.openjfx')
  }
  implementation('org.kordamp.ikonli:ikonli-javafx:12.3.1')
  implementation('org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0')
  implementation 'mysql:mysql-connector-java:8.0.32'
  implementation 'org.jetbrains:annotations:24.1.0'
}

java {
  modularity.inferModulePath.set(true)
}

jar {
  manifest {
    attributes 'Main-Class': 'beat.osu.client.Main'
    attributes 'Automatic-Module-Name': moduleName
  }
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jlink {
  imageZip = project.layout.buildDirectory.file("distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}
